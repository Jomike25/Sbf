name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbf-trainer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK into repo
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/sbf-trainer-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f releases/sbf-trainer-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish built debug APK [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "APK unveraendert, kein neuer Commit noetig"
          fi
